name: Who You Production Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: who-you-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod' && vars.MIRA_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify and install locked dependencies
        run: bash scripts/check.sh
      - name: Build production candidate (no credentials)
        run: |
          cp deploy/cloudflare.prod.config.ts cloudflare.config.ts
          ./node_modules/.bin/cf deploy --dry-run --no-provision
      - name: Publish existing production Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/deploy-production.sh
